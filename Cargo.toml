[package]
name = "nng-pure"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust implementation of the NNG Scalability Protocols"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"

[features]
default = ["std"]
std = ["dep:tokio", "embedded-io-async/std"]

[dependencies]
embedded-io-async = "0.7"
tokio = { version = "1", optional = true, features = ["net", "sync", "rt", "io-util", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
